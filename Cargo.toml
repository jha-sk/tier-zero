[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# --- internal ---
tz-core     = { path = "crates/tz-core" }
tz-embed    = { path = "crates/tz-embed" }
tz-ingest   = { path = "crates/tz-ingest" }
tz-retrieve = { path = "crates/tz-retrieve" }
tz-cache    = { path = "crates/tz-cache" }
tz-agent    = { path = "crates/tz-agent" }
tz-eval     = { path = "crates/tz-eval" }
tz-obs      = { path = "crates/tz-obs" }

# --- async runtime / http ---
tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.8", features = ["macros"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "timeout"] }

# --- serde / config ---
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.9"

# --- errors / cli ---
anyhow      = "1"
thiserror   = "2"
clap        = { version = "4", features = ["derive", "env"] }

# --- observability ---
tracing                  = "0.1"
tracing-subscriber       = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry    = "0.32"
opentelemetry            = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry_sdk        = { version = "0.31", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp       = { version = "0.31", features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry-semantic-conventions = "0.31"

# --- data / text ---
quick-xml     = "0.38"
lol_html      = "2"
tokenizers    = { version = "0.22", default-features = false, features = ["onig"] }
text-splitter = { version = "0.30", features = ["tokenizers"] }
sha2          = "0.10"
blake3        = "1"

# --- vector db ---
qdrant-client = "1.19"

# --- misc ---
rayon       = "1"
hdrhistogram = "7"
rand        = "0.9"
regex       = "1"
once_cell   = "1"
futures     = "0.3"
indicatif   = "0.18"
